name: bharath_fix
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  razorpay_flutter: ^1.4.5
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  lottie: ^3.1.2
  sqflite: ^2.4.0
  path: ^1.9.0
  firebase_core: ^3.2.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  pdf: ^3.12.0
  printing: ^5.14.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

# Top-level configuration (NOT inside dev_dependencies)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  adaptive_icon_background: "#000062"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/